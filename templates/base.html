<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Blog{% endblock %}</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="site-title">tomasz.jedrzejczyk.blog</a>
    <nav>
      <a href="index.html" class="{% if active == 'blog' %}active{% endif %}">Blog</a>
      <a href="gear.html" class="{% if active == 'gear' %}active{% endif %}">Gear</a>
      <a href="contact.html" class="{% if active == 'contact' %}active{% endif %}">Contact</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
